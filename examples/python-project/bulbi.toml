# bulbi.toml — sandbox spec for a Python billing service
spec = "0.1"

[box]
name = "billing-service"
agent = "claude"                 # what `bulbi run` launches by default

[tools]
# The only programs on PATH. Everything else does not exist in the box.
allow = ["python@3.12", "poetry", "git", "rg"]

[setup]
# Runs once, the first time the container starts (network rules apply).
run = ["poetry install"]

[[mount]]
path = "."                        # the current worktree
mode = "read-write"
exclude = [".env", "*.pem"]

[[mount]]
path = "~/docs/billing-api"
mode = "read-only"

[network]
default = "deny"
allow = ["pypi.org", "files.pythonhosted.org", "api.stripe.com"]

[secrets]
# One line per secret. The agent can read these; the network policy limits where it
# can send them. `bulbi check` lists everything that enters the box.
STRIPE_TEST_KEY = { from = "env" }
PYPI_RC         = { from = "file", source = "~/.pypirc", to = "file", path = "~/.pypirc" }

[limits]
cpu = 2
memory = "4GB"

[profiles.reviewer]
mounts = { "." = "read-only" }
network.allow = []

[profiles.test-runner]
tools.allow = ["python@3.12", "poetry"]
