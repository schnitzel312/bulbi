[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bulbi"
version = "0.1.0"
description = "Run coding agents in isolated, spec-defined sandbox environments"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "click>=8.1",
    "docker>=7.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
bulbi = "bulbi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bulbi"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF", "PL"]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.per-file-ignores]
# Tests use literal values freely and local imports to keep cases self-contained.
"tests/**" = ["PLR2004", "PLC0415"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# The docker SDK ships without type information.
module = ["docker", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
